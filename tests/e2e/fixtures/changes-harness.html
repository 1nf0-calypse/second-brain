<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Brain Changes QA harness</title>
  <style>
    body{font-family:sans-serif;max-width:48rem;margin:auto;padding:1rem}button,input,textarea,select{box-sizing:border-box;min-height:44px}nav{display:flex;gap:.5rem}nav button{flex:1}section{margin-top:1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}.card{border:1px solid;padding:1rem;width:100%;text-align:left}.actions{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}@media(max-width:479px){nav,.actions{display:grid;grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>Changes</h1><p>Review MCP proposals before anything is written to your vault.</p>
  <nav aria-label="Changes sections"><button data-nav="pending">Pending reviews (1)</button><button data-nav="templates">Templates</button><button data-nav="history">History</button></nav>
  <div data-testid="content"></div><p data-testid="status" role="status" aria-live="polite" tabindex="-1"></p>
</main>
<script>
const content=document.querySelector('[data-testid="content"]'),status=document.querySelector('[data-testid="status"]');
const pending=()=>{content.innerHTML='<h2>Pending reviews (1)</h2><button class="card" data-testid="pending-item"><strong>Reviews/Sprint-7.md</strong><br>Test MCP · 2 sources<br>1 warning</button>';content.querySelector('button').onclick=review};
const review=()=>{content.innerHTML='<button data-testid="back">Back to pending reviews</button><h1 tabindex="-1" data-testid="review-title">Review knowledge compilation</h1><section><h2>Request</h2><p>Submitted by Test MCP</p></section><section><h2>Target note</h2><strong>Reviews/Sprint-7.md</strong></section><section><h2>Sources (2)</h2><ul><li>Notes/A.md · aaaaa…</li><li>Notes/B.md · bbbbb…</li></ul></section><section><h2>Template</h2><p>Sprint review · version 3</p></section><section><h2>Proposed changes</h2><pre data-testid="diff">+ # Sprint 7\n+ Reviewed result</pre></section><section><h2>Warnings (1)</h2><p>These sources may conflict. Review the highlighted passages before deciding.</p><label><input type="checkbox" data-testid="warnings"> I reviewed the warnings above.</label></section><section><h2>Decision</h2><div class="actions"><button data-testid="confirm" disabled>Confirm and write note</button><button data-testid="reject">Reject proposal</button></div><button data-testid="recovery">Copy recovery request</button></section>';content.querySelector('[data-testid="review-title"]').focus();content.querySelector('[data-testid="back"]').onclick=pending;content.querySelector('[data-testid="warnings"]').onchange=e=>content.querySelector('[data-testid="confirm"]').disabled=!e.target.checked;content.querySelector('[data-testid="confirm"]').onclick=()=>{pending();status.textContent='Confirmed and wrote Reviews/Sprint-7.md. Audit ID: synthetic.'};content.querySelector('[data-testid="reject"]').onclick=()=>{const dialog=document.createElement('dialog');dialog.innerHTML='<h2>Reject proposal</h2><button data-testid="reject-final">Reject proposal</button>';document.body.append(dialog);dialog.showModal();dialog.querySelector('button').onclick=()=>{dialog.close();pending();status.textContent='Rejected Reviews/Sprint-7.md. Nothing was written.'}};content.querySelector('[data-testid="recovery"]').onclick=()=>status.textContent='Recovery request copied.'};
const templates=()=>{content.innerHTML='<h2>Templates</h2><button data-testid="new-template">Create template</button>';content.querySelector('button').onclick=()=>{content.innerHTML='<h3>Create template</h3><label>Template name<input data-testid="template-name"></label><label>Template content<textarea data-testid="template-content"></textarea></label><button data-testid="review-template">Review template version</button>';content.querySelector('[data-testid="review-template"]').onclick=()=>{const name=content.querySelector('[data-testid="template-name"]').value,body=content.querySelector('[data-testid="template-content"]').value;content.innerHTML+=`<section><h3>${name} · version 1</h3><pre data-testid="template-review"></pre><button data-testid="save-template">Save reviewed version</button></section>`;content.querySelector('[data-testid="template-review"]').textContent=body;content.querySelector('[data-testid="save-template"]').onclick=()=>status.textContent=`Template ${name} version 1 saved.`}}};
const history=()=>{content.innerHTML='<h2>History</h2><label>Filter by status<select data-testid="history-filter"><option>All statuses</option><option>incomplete</option></select></label><ul data-testid="history-list"><li><strong>Confirmed.md</strong><p>Operation: success · Rollback: available</p></li><li><strong>Rejected.md</strong><p>Operation: rejected · Rollback: not-applicable</p></li><li data-testid="history-entry"><strong>Incomplete.md</strong><p>Operation: incomplete · Rollback: blocked</p></li><li><strong>Rolled-back.md</strong><p>Operation: success · Rollback: rolled-back</p></li></ul>'};
for(const button of document.querySelectorAll('[data-nav]'))button.onclick=()=>({pending,templates,history})[button.dataset.nav]();pending();
</script></body></html>
